<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  window.dataLayer = window.dataLayer || [];

<title>{{ page.title }}</title>
<meta name="description" content="{{ page.short-description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | escape }} - Free online tarot spreads">
<meta property="og:type" content="article" />
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="Juniper Divination">
<meta property="og:description" content="{{ page.short-description | escape }}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/free-tarot-spread/thumbs/{{page.img}}">
<meta property="og:image:alt" content="{{ page.img-text | default: page.title | escape }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="facebook-domain-verification" content="lxbqwocdkuyqcmaipulabnkrgdpg9w" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link href="{{ site.baseurl }}/assets/css/style.css" rel="stylesheet">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": {{ page.title | jsonify }},
  "description": {{ page.short-description | jsonify }},
  "image": {
    "@type": "ImageObject",
    "contentUrl": "{{ site.url }}/assets/img/free-tarot-spread/{{ page.img }}",
    "url": "{{ site.url }}/assets/img/free-tarot-spread/{{ page.img }}",
    "license": "https://creativecommons.org/licenses/by-nc-sa/4.0/",
    "creator": {
      "@type": "Organization",
      "name": "Juniper Divination",
      "url": "{{ site.url }}"
    },
    "creditText": "Juniper Divination",
    "copyrightNotice": "\u00a9 Juniper Divination. Licensed CC BY-NC-SA 4.0."
  },
  "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
  "isPartOf": {
    "@type": "WebSite",
    "name": "Juniper Divination",
    "url": "{{ site.url }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Juniper Divination",
    "url": "{{ site.url }}"
  }
}
</script>
