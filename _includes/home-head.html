<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KYCX2K1VP6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KYCX2K1VP6');
</script>

<title>{{ page.title }}</title>
{% if page.short-description %}<meta name="description" content="{{ page.short-description | escape }}">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="Juniper Divination">
{% if page.short-description %}<meta property="og:description" content="{{ page.short-description | escape }}">{% endif %}
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/og-image.jpg">
<meta property="og:image:width" content="1201">
<meta property="og:image:height" content="676">
<meta property="og:image:alt" content="Juniper Divination">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="facebook-domain-verification" content="lxbqwocdkuyqcmaipulabnkrgdpg9w" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link href="{{ site.baseurl }}/assets/css/style-home.css" rel="stylesheet">
<meta name="p:domain_verify" content="018ac8c77be2ffd73b7af134d67ebf4b"/>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": {{ page.title | jsonify }},
  "description": {{ page.short-description | jsonify }},
  "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
  "isPartOf": {
    "@type": "WebSite",
    "name": "Juniper Divination",
    "url": "{{ site.url }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Juniper Divination",
    "url": "{{ site.url }}"
  }
}
</script>
