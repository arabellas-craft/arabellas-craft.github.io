<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KYCX2K1VP6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KYCX2K1VP6');
</script>

<title>{{ page.title }}</title>
<meta name="description" content="{{ page.short-description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:type" content="article" />
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="Juniper Divination">
<meta property="og:description" content="{{ page.short-description | escape }}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/article/{{page.img}}">
<meta property="og:image:alt" content="{{ page.img-text | default: page.title | escape }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="facebook-domain-verification" content="lxbqwocdkuyqcmaipulabnkrgdpg9w" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link href="{{ site.baseurl }}/assets/css/style.css" rel="stylesheet">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.short-description | jsonify }},
  "image": "{{ site.url }}/assets/img/article/{{ page.img }}",
  "url": "{{ site.url }}{{ page.url }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
{% if page.last_modified_at %}  "dateModified": "{{ page.last_modified_at | date_to_xmlschema }}",
{% endif %}
  "author": {
    "@type": "Person",
    "name": "Arabella",
    "url": "{{ site.url }}/about/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Juniper Divination",
    "url": "{{ site.url }}"
  }
}
</script>
